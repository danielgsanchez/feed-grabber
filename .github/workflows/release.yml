name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Windows PowerShell, the same shell used to build feed-grabber.user.js locally.
    runs-on: windows-latest
    steps:
      - name: Keep line endings as stored in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Check that the userscript is up to date
        shell: powershell
        run: |
          .\userscript\build.ps1
          git diff --quiet -- feed-grabber.user.js
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error::feed-grabber.user.js is out of date. Run userscript/build.ps1 and commit the result.'
            exit 1
          }

      - name: Create a release if the version is new
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if (git ls-remote --tags origin "refs/tags/$tag") {
            Write-Output "$tag already exists, nothing to release."
            exit 0
          }
          .\scripts\package-extension.ps1
          $notes = 'Download feed-grabber.zip, unzip it, then use Load unpacked in chrome://extensions with Developer mode on. Keep the folder: Chrome loads the extension from it.'
          gh release create $tag dist/feed-grabber.zip --target $env:GITHUB_SHA --title "Feed Grabber $version" --notes $notes --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
